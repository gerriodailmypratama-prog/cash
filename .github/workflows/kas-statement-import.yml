# Kas statement auto-import (Fase B).
# pdf.js can't run inside a Cloudflare Worker, so the DOB-locked statement PDFs
# are unlocked here (Node) instead: pull the next locked PDF from the bot worker,
# brute-force the birth-date password, extract text, and post it back. The worker
# then AI-parses + checksums it and DMs the owner a one-tap import.
name: kas-statement-import

on:
  schedule:
    - cron: '17 * * * *'   # hourly (offset to avoid the top-of-hour rush)
  workflow_dispatch: {}      # manual "Run workflow" button

concurrency:
  group: kas-statement-import
  cancel-in-progress: false

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: scripts/statement-unlock
        run: npm ci || npm install
      - name: Unlock + hand off statements
        working-directory: scripts/statement-unlock
        env:
          WORKER_URL: ${{ secrets.KAS_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.KAS_WEBHOOK_SECRET }}
          DOB_JSON: ${{ secrets.KAS_DOB_JSON }}
        run: node unlock.mjs
